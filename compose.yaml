services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_DSN: "${POSTGRES_DSN:?Set POSTGRES_DSN in .env}"
      REDIS_ADDR: "${REDIS_ADDR:?Set REDIS_ADDR in .env}"
    ports:
      - "127.0.0.1:${BLOG_GRPC_PORT:-8000}:8000"
      - "127.0.0.1:${BLOG_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
    name: blog_postgres_data
  redis_data:
    name: blog_redis_data
